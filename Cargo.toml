[package]
name = "norway_etl"
version = "0.1.0"
edition = "2024"

[dependencies]
async-std = { version = "1.13.1", features = ["attributes", "tokio1"] }
dotenv = "0.15.0"
reqwest = { version = "0.12.14", features = ["blocking"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_urlencoded = "0.7.1"
tokio = { version = "1.44.1", features = ["full"] }
